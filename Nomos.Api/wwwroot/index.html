<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
  // Escala consistente entre móviles: los que tienen un viewport CSS estrecho (p. ej. S22 Ultra)
  // renderizan la app "zoomed in". Aquí, si el ancho es menor que MIN, forzamos width=MIN: el
  // navegador escala ese diseño para caber, dejando la misma escala que un móvil ancho (S25+).
  (function () {
    var MIN = 400;
    var w = window.innerWidth;
    if (w && w > 0 && w < MIN - 4) {
      var m = document.querySelector('meta[name="viewport"]');
      if (m) m.setAttribute('content', 'width=' + MIN + ', viewport-fit=cover');
    }
  })();
  </script>
  <title>PLUTO</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💠</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b3a8e">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bootLoader" class="boot-loader">
    <span class="boot-spinner"></span>
    <p id="bootMsg" class="boot-msg">Cargando…</p>
  </div>

  <header class="topbar">
    <button id="profileBtn" class="icon-btn avatar-btn hidden" title="Perfil" aria-label="Perfil"></button>
    <span class="brand">P&thinsp;L&thinsp;U&thinsp;T&thinsp;O</span>
    <button id="themeBtn" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
  </header>

  <!-- Primera carga / error de la vista activa (las hojas tienen su propio spinner). -->
  <div id="viewLoader" class="view-loader hidden"></div>

  <!-- ===== Vista Gastos ===== -->
  <main id="view-gastos" class="view">
    <section class="hero">
      <p class="eyebrow">Saldo disponible</p>
      <h1 class="hero-amount" id="gBalance">&nbsp;</h1>
      <div class="reed"></div>
      <div class="hero-accounts hidden" id="gBalanceAccounts"></div>
      <p class="hero-sub" id="gMonthSummary"></p>
    </section>

    <div class="grid">
      <div class="col">
        <section class="card">
          <div class="card-head">
            <h3>Evolución</h3>
            <div class="pills">
              <button class="pill active" data-days="30">30d</button>
              <button class="pill" data-days="90">90d</button>
            </div>
          </div>
          <div id="gChart" class="chart"></div>
        </section>

        <section class="card">
          <h3>Por categoría</h3>
          <div class="cat-accounts hidden" id="gCatAccounts"></div>
          <div class="cat-wrap">
            <div id="gDonut" class="donut"></div>
            <ul id="gCatList" class="cat-list"></ul>
          </div>
        </section>
      </div>

      <div class="col">
        <section class="card">
          <div class="card-head">
            <h3>Recientes</h3>
            <button id="verTodoBtn" class="link">Ver todo</button>
          </div>
          <ul id="gRecent" class="tx-list"></ul>
        </section>
      </div>
    </div>
  </main>

  <!-- ===== Vista Patrimonio ===== -->
  <main id="view-patrimonio" class="view hidden">
    <section class="nw-hero">
      <p class="eyebrow">Patrimonio neto</p>
      <h1 class="hero-amount" id="nwTotal">&nbsp;</h1>
      <div class="reed"></div>
      <p class="hero-delta" id="nwDelta"></p>
    </section>

    <div class="two-cards">
      <section class="card"><p class="muted-label">Activos</p><p id="nwAssets" class="big-figure green"></p></section>
      <section class="card"><p class="muted-label">Pasivos</p><p id="nwLiab" class="big-figure red"></p></section>
    </div>

    <section class="card">
      <div class="card-head">
        <h3>Evolución</h3>
        <div class="pills">
          <button class="pill active" data-nw="30">30d</button>
          <button class="pill" data-nw="90">90d</button>
          <button class="pill" data-nw="year">Año</button>
        </div>
      </div>
      <div id="nwChart" class="chart"></div>
    </section>

    <div id="nwSections"></div>
  </main>

  <button id="fab" class="hidden" title="Añadir movimiento">+</button>

  <nav class="tabbar">
    <button class="tab active" data-view="gastos"><span aria-hidden="true">💸</span> <span>Gastos</span></button>
    <button class="tab" data-view="patrimonio"><span aria-hidden="true">📊</span> <span>Patrimonio</span></button>
  </nav>

  <!-- ===== Hoja modal (movimientos / cuentas / perfil / ver todo) =====
       En móvil el panel llena la pantalla; en escritorio es un diálogo centrado y el
       contenedor exterior hace de fondo atenuado (click fuera = cancelar). -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
      <div class="sheet-bar">
        <button id="sheetCancel" class="link">Cancelar</button>
        <span id="sheetTitle" class="sheet-title"></span>
        <button id="sheetSave" class="link save" disabled>Guardar</button>
      </div>
      <p id="sheetError" class="sheet-error" role="alert"></p>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <!-- ===== Pantalla de acceso ===== -->
  <div id="authScreen" class="auth-screen hidden">
    <div class="auth-card">
      <p class="auth-brand">P&thinsp;L&thinsp;U&thinsp;T&thinsp;O</p>
      <div class="reed"></div>
      <h2 id="authTitle" class="auth-title">Iniciar sesión</h2>

      <label id="authPhotoPick" class="avatar-pick hidden" for="authPhotoInput" title="Elegir foto de perfil">📷</label>
      <input id="authPhotoInput" type="file" accept="image/*" hidden>

      <input id="authUser" class="text-field" placeholder="Nombre de usuario" maxlength="30" autocomplete="username">
      <input id="authPass" class="text-field" type="password" placeholder="Contraseña" maxlength="128" autocomplete="current-password">
      <input id="authPass2" class="text-field hidden" type="password" placeholder="Repite la contraseña" maxlength="128" autocomplete="new-password">

      <p id="authError" class="auth-error"></p>
      <button id="authSubmit" class="primary-btn">Entrar</button>
      <button id="authToggle" class="link auth-toggle">¿No tienes cuenta? Regístrate</button>
    </div>
  </div>

  <!-- role=status: los avisos (incluido «Deshacer») se anuncian a los lectores de pantalla. -->
  <div id="toast" class="toast hidden" role="status"></div>

  <!-- Módulos por capa (persistencia / lógica / presentación). El ORDEN de carga es por
       dependencia (helpers primero, arranque al final), no por capa: no reordenar. -->
  <script src="js/logica/i18n.js"></script>
  <script src="js/logica/format.js"></script>
  <script src="js/logica/categories.js"></script>
  <script src="js/persistencia/net.js"></script>
  <script src="js/presentacion/charts.js"></script>
  <script src="js/logica/state.js"></script>
  <script src="js/presentacion/views.js"></script>
  <script src="js/presentacion/sheet.js"></script>
  <script src="js/presentacion/sheets.js"></script>
  <script src="js/presentacion/profile.js"></script>
  <script src="js/presentacion/auth.js"></script>
  <script src="js/presentacion/main.js"></script>
</body>
</html>
